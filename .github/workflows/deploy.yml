name: Deploy CRM ERP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e

            APP_DIR=/root/technox
            APP_NAME=app-masterfaheem

            cd "$APP_DIR"

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Stopping app..."
            pm2 stop "$APP_NAME" 2>/dev/null || true

            echo "==> Killing leftover node processes for this app..."

            # Build a skip list: our shell + all its ancestors.
            SELF=$$
            SKIP=" $SELF "
            p=$SELF
            while [ "$p" != "1" ] && [ -n "$p" ]; do
              p=$(awk '{print $4}' "/proc/$p/stat" 2>/dev/null || echo "")
              [ -n "$p" ] && SKIP="$SKIP$p "
            done

            # Only consider processes whose binary name is exactly "node".
            for pid in $(pgrep -x node 2>/dev/null || true); do
              case " $SKIP " in *" $pid "*) continue ;; esac
              [ -d "/proc/$pid" ] || continue
              if [ -L "/proc/$pid/cwd" ]; then
                CWD=$(readlink "/proc/$pid/cwd" 2>/dev/null || echo "")
                case "$CWD" in
                  "$APP_DIR"*)
                    echo "    killing pid=$pid cwd=$CWD"
                    kill -9 "$pid" 2>/dev/null || true
                    ;;
                esac
              fi
            done

            sleep 2

            echo "==> Deleting build artifacts..."
            rm -rf .next || true

            if [ -d node_modules ]; then
              rm -rf node_modules 2>/dev/null || {
                echo "    node_modules still locked — waiting..."
                sleep 3
                rm -rf node_modules
              }
            fi

            echo "==> Installing dependencies..."
            npm ci

            echo "==> Building application..."
            npm run build

            echo "==> Restarting application..."
            pm2 restart "$APP_NAME" --update-env || pm2 start npm --name "$APP_NAME" -- start

            echo "==> Saving PM2 configuration..."
            pm2 save

            echo "==> Deployment completed successfully."
            pm2 status "$APP_NAME"
