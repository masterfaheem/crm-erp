name: Deploy CRM ERP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e

            APP_DIR=/root/technox
            APP_NAME=app-masterfaheem

            cd "$APP_DIR"

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Stopping app (if running)..."
            pm2 stop "$APP_NAME" 2>/dev/null || true

            echo "==> Killing any leftover node processes for this app..."
            # Kill by process name — but ONLY processes whose cwd is $APP_DIR.
            # This avoids killing the SSH session or unrelated node apps (like chatbot).
            for pid in $(pgrep -u "$(id -u)" -f "next" || true); do
              # skip if PID no longer exists
              [ -d "/proc/$pid" ] || continue
              # only kill if its cwd is our app dir (or a subdir)
              if [ -L "/proc/$pid/cwd" ]; then
                CWD=$(readlink "/proc/$pid/cwd" 2>/dev/null || echo "")
                case "$CWD" in
                  "$APP_DIR"*)
                    echo "    killing pid=$pid cwd=$CWD"
                    kill -9 "$pid" 2>/dev/null || true
                    ;;
                esac
              fi
            done

            # Give the kernel a moment to release file handles
            sleep 2

            echo "==> Deleting build artifacts..."
            rm -rf .next || true

            # If node_modules still has locked dirs, retry once after another delay
            if [ -d node_modules ]; then
              rm -rf node_modules 2>/dev/null || {
                echo "    node_modules still locked — waiting..."
                sleep 3
                rm -rf node_modules
              }
            fi

            echo "==> Installing dependencies..."
            npm ci

            echo "==> Building application..."
            npm run build

            echo "==> Restarting application..."
            pm2 restart "$APP_NAME" --update-env || pm2 start npm --name "$APP_NAME" -- start

            echo "==> Saving PM2 configuration..."
            pm2 save

            echo "==> Deployment completed successfully."
            pm2 status "$APP_NAME"
