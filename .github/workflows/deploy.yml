name: Deploy CRM ERP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e

            APP_DIR=/root/technox
            APP_NAME=app-masterfaheem

            cd "$APP_DIR"

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Stopping app (if running)..."
            pm2 stop "$APP_NAME" 2>/dev/null || true

            echo "==> Cleaning previous build artifacts..."
            # Kill anything holding files in .next / node_modules, but ONLY
            # processes owned by us and never our own shell / ancestors.
            MY_PID=$$
            for pat in "next build" "next-server" "next dev"; do
              pids=$(pgrep -u "$(id -u)" -f "$pat" || true)
              for pid in $pids; do
                # Skip self and any ancestor
                if [ "$pid" = "$MY_PID" ]; then continue; fi
                if grep -q "^PPid:.*$(echo $MY_PID)" /proc/$pid/status 2>/dev/null; then continue; fi
                kill "$pid" 2>/dev/null || true
              done
            done
            sleep 1

            rm -rf node_modules .next

            echo "==> Installing dependencies..."
            npm ci

            echo "==> Building application..."
            npm run build

            echo "==> Restarting application..."
            pm2 restart "$APP_NAME" --update-env || pm2 start npm --name "$APP_NAME" -- start

            echo "==> Saving PM2 configuration..."
            pm2 save

            echo "==> Deployment completed successfully."
            pm2 status "$APP_NAME"
