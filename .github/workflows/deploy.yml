name: Deploy CRM ERP

on:
  push:
    branches:
      - main
  workflow_dispatch:

# a newer deploy replaces one that is still running / stuck
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e

            APP_DIR=/root/technox
            APP_NAME=app-masterfaheem

            cd "$APP_DIR"

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Stopping app..."
            pm2 stop "$APP_NAME" 2>/dev/null || true

            echo "==> Killing leftover node processes for this app..."

            # Build a skip list: our shell + all its ancestors.
            SELF=$$
            SKIP=" $SELF "
            p=$SELF
            while [ "$p" != "1" ] && [ -n "$p" ]; do
              p=$(awk '{print $4}' "/proc/$p/stat" 2>/dev/null || echo "")
              [ -n "$p" ] && SKIP="$SKIP$p "
            done

            # Any node / next process (incl. a stuck "next build", which renames itself)
            # running from the app folder. The PM2 daemon itself is never touched.
            for d in /proc/[0-9]*; do
              pid=${d#/proc/}
              case " $SKIP " in *" $pid "*) continue ;; esac
              CWD=$(readlink "$d/cwd" 2>/dev/null || echo "")
              case "$CWD" in "$APP_DIR"*) ;; *) continue ;; esac
              CMD=$(tr '\0' ' ' < "$d/cmdline" 2>/dev/null || echo "")
              case "$CMD" in *PM2*|*pm2*) continue ;; esac
              case "$CMD" in
                *node*|*next*)
                  echo "    killing pid=$pid cmd=$(echo "$CMD" | cut -c1-80)"
                  kill -9 "$pid" 2>/dev/null || true
                  ;;
              esac
            done

            sleep 2

            echo "==> Deleting build artifacts..."
            rm -rf .next || true

            if [ -d node_modules ]; then
              rm -rf node_modules 2>/dev/null || {
                echo "    node_modules still locked — waiting..."
                sleep 3
                rm -rf node_modules
              }
            fi

            echo "==> Installing dependencies..."
            npm ci

            echo "==> Server resources before build..."
            free -m || true
            nproc || true
            df -h "$APP_DIR" | tail -1 || true

            echo "==> Building application..."
            export NEXT_TELEMETRY_DISABLED=1
            # never hang forever: stop the build after 12 minutes so the log shows it
            timeout 12m npm run build

            echo "==> Restarting application..."
            pm2 restart "$APP_NAME" --update-env || pm2 start npm --name "$APP_NAME" -- start

            echo "==> Saving PM2 configuration..."
            pm2 save

            echo "==> Deployment completed successfully."
            pm2 status "$APP_NAME"
